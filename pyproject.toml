[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polestar-dpapi-client"
version = "1.0.1"
description = "A Python module for interfacing with the Polestar data platform."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kim-Eirik Karlsen", email = "kim.eirik@gmail.com"}
]
keywords = ["polestar", "api", "data-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/kimma/polestar-dpapi-client"
Repository = "https://github.com/kimma/polestar-dpapi-client"
"Bug Tracker" = "https://github.com/kimma/polestar-dpapi-client/issues"

[tool.setuptools.packages.find]
include = ["polestar_dpapi_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
